# DSH Plugin Manager bundle entry. Initialize Python with the installer first.
# Use this bundle OR the connection launcher, never both for one profile.
- insert:
    - id: memory-brain
      name: ./adapters/dsh/memory-brain.mjs
      config:
        enabled: true
        autoStart: true
        queueNamespace: default
        contextEnabled: true
        contextTriggerTurns: 12
        contextKeepTurns: 4
        contextSummaryEnabled: true
        contextSummaryMaxChars: 2000
        contextSummaryMaxTokens: 4096
        contextPressureCooldownMs: 60000
        contextPressureThresholdRatio: 0.8
        contextPressureRetainRatio: 0.16
        contextPressureHeadroomTokens: 4096
        contextToolPruneEnabled: true
        contextToolPruneThresholdChars: 4096
        contextToolPruneHeadChars: 2048
        contextToolPruneTailChars: 512
