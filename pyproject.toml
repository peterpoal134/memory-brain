[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaojiu-brain"
version = "0.2.0a17"
description = "Memory Brain: evidence-first conversation memory with a local 3D control interface"
requires-python = ">=3.10"
dependencies = ["tzdata>=2024.1; platform_system == 'Windows'"]
license = {file = "LICENSE"}
readme = "README.md"

[project.scripts]
xiaojiu-brain = "xiaojiu_brain.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE.md"]

[tool.setuptools.packages.find]
include = ["xiaojiu_brain*"]

[tool.setuptools.package-data]
xiaojiu_brain = ["static/*", "static/icons/*", "static/cortex/*", "static/vendor/*"]

[tool.setuptools.exclude-package-data]
xiaojiu_brain = ["static/brain-fallback.png"]
