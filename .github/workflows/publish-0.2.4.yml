name: Publish verified 0.2.4 resource fix
# Source and wheel content are identical across native-path build IDs.

on:
  push:
    branches: [release/0.2.4-resource-fix]
    paths: [.github/workflows/publish-0.2.4.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memory-brain-release-0.2.4
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.repository == 'peterpoal134/memory-brain' && github.ref == 'refs/heads/release/0.2.4-resource-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build and verify the public archive
        run: |
          python -X utf8 scripts/build_plugin_release.py --out dist
          python -X utf8 checks/release_verified_build.py
      - name: Promote only the verified distribution
        run: |
          test "$(python -c 'import json; print(json.load(open("package.json"))["version"])')" = '0.2.4'
          git fetch origin main
          test "$(git rev-parse origin/main)" = '91bf265dd24c8341174eeb1fb0d2020ae4e6f7d0'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force -- PUBLIC-RELEASE.json SHA256SUMS.json wheels/xiaojiu_brain-0.2.4-py3-none-any.whl
          git diff --cached --quiet || git commit -m 'build: attach verified 0.2.4 distribution'
          git push --atomic origin HEAD:refs/heads/main HEAD:refs/heads/release/0.2.4-resource-fix
      - name: Publish the checked downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.4 dist/memory-brain-dsh-0.2.4-public.zip dist/memory-brain-dsh-0.2.4-public.zip.sha256 --target "$(git rev-parse HEAD)" --title 'v0.2.4 资源管理与压缩修复' --notes-file docs/RELEASE-0.2.4.md --latest
